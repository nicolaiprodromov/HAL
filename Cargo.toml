[package]
name = "hal"
version = "0.1.0"
edition = "2021"
description = "HAL — Heuristic Agentic Language runtime"
license = "MIT OR Apache-2.0"

[[bin]]
name = "hal"
path = "src/main.rs"

[lib]
name = "hal"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Narrow tokio features to what the codebase actually touches. `full` pulls in
# tokio-fs/process/net which we don't use and which add to compile time.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
    "signal",
] }
ratatui = "0.29"
crossterm = "0.28"
# Disable rig-core's default `rustls` feature — it transitively pulls
# `aws-lc-sys` (a very large C/C++ crate that is the main cause of multi-minute
# builds and high memory use on install). Use `native-tls` instead so both
# rig-core's reqwest 0.13 and our reqwest 0.12 share the system OpenSSL backend.
rig-core = { version = "0.35", default-features = false, features = [
    "derive",
    "reqwest",
    "native-tls",
] }
tokio-rusqlite = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
bollard = "0.20"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "1"
futures = "0.3"
# Named directly by the retrying HTTP client handed to rig (`src/http_retry.rs`).
bytes = "1"
http = "1"
futures-util = "0.3"
async-trait = "0.1"
# Use native-tls (system OpenSSL) instead of rustls-tls — avoids compiling
# aws-lc-sys/ring and duplicate rustls stacks alongside rig-core's reqwest.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
scraper = "0.20"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
schemars = "0.8"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
unicode-width = "0.1"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# Release profile tuned for fast `install.sh` / `just release` builds rather
# than squeezing the last 2% of runtime performance.
#
# Previous settings (`lto = "thin"`, `codegen-units = 1`) forced single-threaded
# LLVM codegen across every crate and ran thin LTO on top, which made release
# builds many times slower and memory-heavy enough to freeze modest machines.
# The defaults below keep optimisations on while letting cargo parallelise.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = false
strip = "symbols"
incremental = false

# Keep heavy C/C++ build scripts (bundled sqlite, blake3, etc.) at low
# optimisation — the compile-time cost of -O3 on generated C code dwarfs any
# runtime benefit for build-time codegen.
[profile.release.build-override]
opt-level = 0
[profile.dev.build-override]
opt-level = 0
